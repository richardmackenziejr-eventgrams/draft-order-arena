<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Join a League — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Join your league</h1>
  <p class="lead">Enter the join code your commissioner shared, plus your name.</p>

  <div class="panel">
    <form id="join-form">
      <label for="code">Join code</label>
      <input type="text" id="code" placeholder="e.g. PLKQ7X" style="text-transform:uppercase" required />

      <label for="name">Your name</label>
      <input type="text" id="name" placeholder="e.g. Sam" required />

      <button type="submit">Join league</button>
      <p class="error" id="err" style="display:none"></p>
    </form>
  </div>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/js/common.js"></script>
<script src="/js/join.js"></script>
</body>
</html>
