<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create a League — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Register your league</h1>
  <p class="lead">You'll get a join code to share with your league members.</p>

  <div class="panel">
    <form id="create-form">
      <label for="league-name">League name</label>
      <input type="text" id="league-name" placeholder="e.g. The Gridiron Gauntlet" required />

      <label for="commish-name">Your name (commissioner)</label>
      <input type="text" id="commish-name" placeholder="e.g. Alex" required />

      <button type="submit">Create league</button>
      <p class="error" id="err" style="display:none"></p>
    </form>
  </div>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/js/common.js"></script>
<script src="/js/commissioner.js"></script>
</body>
</html>
