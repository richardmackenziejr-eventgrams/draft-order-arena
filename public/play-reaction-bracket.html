<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reaction Duel Bracket — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Reaction Duel Bracket</h1>
  <p class="lead" id="status-line">Loading…</p>

  <div class="panel" id="match-panel" style="display:none">
    <h2 style="margin-top:0" id="match-title">Your match</h2>
    <div class="reaction-box idle" id="reaction-box">Loading…</div>
    <p class="muted" id="match-hint" style="margin-top:10px"></p>
  </div>

  <div class="panel">
    <h2 style="margin-top:0">Bracket</h2>
    <div id="bracket"></div>
  </div>

  <p><a class="btn secondary" id="back-link" href="/">Back</a></p>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/play-reaction-bracket.js"></script>
</body>
</html>
