<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kickoff Return — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Kickoff Return</h1>
  <p class="lead" id="status-line">Loading…</p>

  <div class="panel" id="game-panel" style="display:none">
    <p class="kr-return-info" id="return-info"></p>
    <div id="kr-canvas-wrap">
      <canvas id="kr-canvas" width="480" height="720"></canvas>
    </div>
    <p class="kr-hint">Arrow keys to move &middot; <strong>Z</strong> to juke &middot; <strong>X</strong> to spin</p>
    <div class="kr-action-row">
      <button id="start-return-btn" class="btn" style="display:none">Start Return &rarr;</button>
      <button id="next-return-btn" class="btn" style="display:none">Next Return &rarr;</button>
    </div>
    <p id="kr-result"></p>
  </div>

  <div class="panel" id="desktop-only-panel" style="display:none">
    <p>Kickoff Return needs a keyboard to play — try it on a desktop or laptop browser.</p>
  </div>

  <div class="panel" id="done-panel" style="display:none">
    <p id="done-message"></p>
  </div>

  <p><a class="btn secondary" id="back-link" href="/">Back</a></p>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/js/common.js"></script>
<script src="/js/play-kickoff-return.js"></script>
</body>
</html>
