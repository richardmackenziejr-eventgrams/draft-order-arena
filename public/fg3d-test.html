<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Field Goal Kick 3D (Test) — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
<style>
  #fg3d-canvas-wrap {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: #8ec9f0;
  }
  #fg3d-canvas-wrap canvas { display: block; width: 100%; height: 100%; }
  .fg3d-hint { text-align: center; opacity: 0.7; font-size: 0.9em; margin-top: 8px; }
  .fg3d-distance-row {
    max-width: 960px;
    margin: 16px auto 0;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .fg3d-distance-row input[type="range"] { flex: 1; }
  .fg3d-distance-row label { white-space: nowrap; min-width: 9em; }
  .fg3d-kick-row {
    max-width: 960px;
    margin: 12px auto 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  #fg3d-result { font-weight: bold; font-size: 1.1em; margin: 0; }
</style>
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Field Goal Kick — 3D Prototype</h1>
  <p class="lead">A Three.js version of the kicking scene — click to lock the power arc, then the direction arrow, to actually attempt the kick. Drag to look around.</p>
  <div class="panel">
    <div id="fg3d-canvas-wrap"></div>
    <p class="fg3d-hint">Drag to orbit &middot; scroll to zoom</p>
    <div class="fg3d-distance-row">
      <input type="range" id="fg3d-distance" min="25" max="55" value="40" />
      <label id="fg3d-distance-label" for="fg3d-distance">40 yd Field Goal</label>
    </div>
    <div class="fg3d-kick-row">
      <button id="fg3d-action-btn" class="btn">Lock Power!</button>
      <p id="fg3d-result"></p>
    </div>
  </div>
  <p><a class="btn secondary" href="/">Back</a></p>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/js/fg3d-test.js"></script>
</body>
</html>
