<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Field Goal Kick 3D (Test) — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
<style>
  #fg3d-canvas-wrap {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: #8ec9f0;
  }
  #fg3d-canvas-wrap canvas { display: block; width: 100%; height: 100%; }
  .fg3d-hint { text-align: center; opacity: 0.7; font-size: 0.9em; margin-top: 8px; }
</style>
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Field Goal Kick — 3D Prototype</h1>
  <p class="lead">A visual-only test of a Three.js version of the kicking scene — not wired up to real gameplay yet. Drag to look around.</p>
  <div class="panel">
    <div id="fg3d-canvas-wrap"></div>
    <p class="fg3d-hint">Drag to orbit &middot; scroll to zoom</p>
  </div>
  <p><a class="btn secondary" href="/">Back</a></p>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/js/fg3d-test.js"></script>
</body>
</html>
