<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Football Trivia — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Football Trivia</h1>
  <p class="lead" id="status-line">Loading…</p>

  <div class="panel" id="quiz-panel" style="display:none">
    <div class="trivia-timer-num" id="timer-num">10</div>
    <h2 id="question-text" style="margin-top:6px"></h2>
    <div id="choices"></div>
    <p id="feedback" class="trivia-feedback" style="display:none"></p>
    <button id="next-btn" style="display:none">Next question →</button>
  </div>

  <div class="panel" id="done-panel" style="display:none">
    <p id="done-message"></p>
  </div>

  <p><a class="btn secondary" id="back-link" href="/">Back</a></p>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/js/common.js"></script>
<script src="/js/play-trivia.js"></script>
</body>
</html>
