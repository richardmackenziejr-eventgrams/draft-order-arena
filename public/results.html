<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Results — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>

    <ol class="order-list" id="final-order"></ol>
  </div>

  <div class="panel" id="per-game-panel">
    <h2 style="margin-top:0">Per-game results</h2>
    <div id="per-game"></div>
  </div>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/js/common.js"></script>

</body>
