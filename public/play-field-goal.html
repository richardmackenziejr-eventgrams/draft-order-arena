<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Field Goal Kick — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Field Goal Kick</h1>
  <p class="lead" id="status-line">Loading…</p>

  <div class="panel" id="kick-panel" style="display:none">
    <p class="fg-kick-info" id="kick-info"></p>
    <div id="fg3d-canvas-wrap"></div>
    <p class="fg3d-hint">Drag to orbit &middot; scroll to zoom</p>
    <div class="fg3d-kick-row">
      <button id="fg3d-action-btn" class="btn">Lock Power!</button>
      <button id="next-kick-btn" class="btn" style="display:none">Next Kick &rarr;</button>
    </div>
    <p id="fg3d-result"></p>
  </div>

  <div class="panel" id="done-panel" style="display:none">
    <p id="done-message"></p>
  </div>

  <p><a class="btn secondary" id="back-link" href="/">Back</a></p>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/js/common.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
  }
}
</script>
<script type="module" src="/js/play-field-goal.js"></script>
</body>
</html>
