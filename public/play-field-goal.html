<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Field Goal Kick — Draft Order Arena</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site">
  <a class="logo" href="/">Draft Order <span>Arena</span></a>
</header>
<main>
  <h1>Field Goal Kick</h1>
  <p class="lead" id="status-line">Loading…</p>

  <div class="panel" id="kick-panel" style="display:none">
    <div class="fg-scene" id="fg-scene"></div>

    <p class="fg-kick-info" id="kick-info"></p>
    <p class="fg-wind" id="wind-line"></p>

    <div class="fg-meters" id="fg-meters">
      <div class="fg-power-block">
        <p class="fg-meter-label">Power</p>
        <div class="power-track" id="power-track">
          <div class="power-sweet" id="power-sweet"></div>
          <div class="power-marker" id="power-marker"></div>
        </div>
        <button id="power-stop-btn" class="fg-stop-btn">Click to lock power!</button>
      </div>

      <div class="fg-direction-block" id="direction-block">
        <p class="fg-meter-label">Direction</p>
        <div class="direction-track" id="direction-track">
          <div class="direction-center-mark"></div>
          <div class="direction-marker" id="direction-marker"></div>
        </div>
        <button id="direction-stop-btn" class="fg-stop-btn" disabled>Click to kick!</button>
      </div>
    </div>

    <div id="result-step" style="display:none">
      <p class="fg-result" id="result-text"></p>
      <button id="next-kick-btn" style="display:block; margin:0 auto">Next Kick →</button>
    </div>
  </div>

  <div class="panel" id="done-panel" style="display:none">
    <p id="done-message"></p>
  </div>

  <p><a class="btn secondary" id="back-link" href="/">Back</a></p>
</main>
<footer class="site">Draft Order Arena — prototype</footer>
<script src="/js/common.js"></script>
<script src="/js/play-field-goal.js"></script>
</body>
</html>
